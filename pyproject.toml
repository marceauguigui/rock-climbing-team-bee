[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-climbing-team-bee"
version = "0.1.0"
description = "Microban RL climbing and locomotion environment workspace"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    # Core & Physics
    "numpy<2.3.0,>=2.2.5",
    "opencv-python>=5.0.0.93",
    "pillow>=10",
    "mujoco>=3.11,<4",
    "placo>=0.10.2",
    # ML & RL Frameworks
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    "onnxruntime>=1.26.0",
    "scipy>=1.18.1",
    # Hardware & Control
    "pollen_bmi088_imu_library==1.0.0rc1",
    "rustypot>=1.13.1",
    # Local workspace modules
    "better-actuator-models",
    "microban-model",
    "microban-sim",
    "microban",
    "climbing-sim",
    "mjlab-microban",
    "pyrealsense2>=2.59.1.11053",
    "meshcat>=0.3.2",
]

[dependency-groups]
dashboard = [
    "mujoco>=3.2",
    "aiohttp>=3.9",
    "zeroconf>=0.130",
]
sim = [
    "microban-sim",
]

[project.scripts]
climbing-sim-cameras = "climbing_sim.tools.camera_editor:main"
climbing-sim-wall = "climbing_sim.tools.wall_tool:main"
climbing-sim-wall-editor = "climbing_sim.tools.wall_editor:main"

[project.entry-points."mjlab.tasks"]
mjlab_microban = "mjlab_microban.tasks"

[tool.uv.workspace]
members = [
    "src/mjlab_microban",
    "src/microban_model",
    "src/microban",
    "src/simulator",
]

[tool.uv]
override-dependencies = [
    "better-actuator-models @ git+https://github.com/Rhoban/bam.git@e9a619d56da5236206f4de6ceec2c1ee1b497b5c",
    "numpy<2.3.0,>=2.2.5",
    "microban-model",
]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "e9a619d56da5236206f4de6ceec2c1ee1b497b5c" }
microban-sim = { git = "https://github.com/Rhoban/microban_sim" }
microban-model = { workspace = true }
microban = { workspace = true }
climbing-sim = { workspace = true }
mjlab-microban = { workspace = true }

[tool.ruff]
src = ["src"]
indent-width = 4
exclude = [
    "src/mjlab/third_party",
    "typings",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microban"
version = "0.1.0"
description = "Microban RL environment for mjlab"
readme = "README.md"
requires-python = ">=3.12, <3.13"  # Limité strictement à 3.12 pour éviter les conflits NumPy de 3.13
dependencies = [
  "mjlab==1.3.0",
  "warp-lang==1.12.0",
  "placo>=0.9.20",
  "better-actuator-models",
  "microban",
  "climbing-sim",
]

[project.entry-points."mjlab.tasks"]
mjlab_microban = "mjlab_microban.tasks"

[tool.ruff]
src = ["src"]
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

[tool.uv]
override-dependencies = [
  "better-actuator-models @ git+https://github.com/Rhoban/bam.git@e9a619d56da5236206f4de6ceec2c1ee1b497b5c",
  "numpy<2.3.0,>=2.2.5",
]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "e9a619d56da5236206f4de6ceec2c1ee1b497b5c" }
microban = { path = "../microban", editable = true }
climbing-sim = { path = "../simulator", editable = true }